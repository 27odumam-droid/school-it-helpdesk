{% extends "base.html" %}
{% block title %}Submit a ticket · School IT Help Desk{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <p class="eyebrow">NEW REQUEST</p>
    <h1>Submit a support ticket</h1>
    <p>Tell the IT team where the issue is and what is happening.</p>
  </div>
</section>
<form id="new-ticket-form" class="panel form-grid">
  <label>Room
    <input name="room" required maxlength="80" autocomplete="off">
  </label>
  <label>Device
    <input name="device" required maxlength="120" autocomplete="off">
  </label>
  <label>Category
    <select name="category" required>
      <option value="">Choose a category</option>
      <option>Hardware</option><option>Software</option><option>Network</option><option>Other</option>
    </select>
  </label>
  <label>Priority
    <select name="priority" required>
      <option value="">Choose a priority</option>
      <option>Low</option><option>Medium</option><option>High</option>
    </select>
  </label>
  <label class="full-width">Description
    <textarea name="description" rows="5" required minlength="10" maxlength="4000"
      aria-describedby="description-help"></textarea>
    <span id="description-help" class="field-help">At least 10 non-whitespace characters.</span>
  </label>
  <div class="full-width form-actions">
    <button type="submit">Create ticket</button>
    <a class="button button-secondary" href="/">Cancel</a>
  </div>
  <p id="form-message" class="message full-width" role="status" aria-live="polite"></p>
</form>
{% endblock %}
